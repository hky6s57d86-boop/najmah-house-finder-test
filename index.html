<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Najmah Camp Location Finder V3.2</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="najmah-map-header-v2.png" as="image">
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-labelledby="app-title">
      <div class="map-header" aria-hidden="true">
        <div class="map-image"></div>
        <div class="map-tint"></div>

        <div class="lock-badge">
          <svg class="lock-icon" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 42V31.5C30 21.835 37.835 14 47.5 14h1C58.165 14 66 21.835 66 31.5V42"
                  stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
            <rect x="19" y="38" width="58" height="46" rx="11" fill="currentColor"/>
            <circle cx="48" cy="58" r="6" fill="#0b1728"/>
            <path d="M48 62V70" stroke="#0b1728" stroke-width="6" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="login-content">
        <div class="title-row">
          <h1 id="app-title">Najmah Camp Location Finder</h1>
          <span class="version-badge">V3.2</span>
        </div>

        <form id="login-form" class="login-form" novalidate>
          <label for="password">Enter Password</label>
          <input id="password" name="password" type="password" inputmode="numeric"
                 autocomplete="current-password" pattern="[0-9]*" maxlength="4"
                 aria-describedby="password-error">
          <p id="password-error" class="form-message" aria-live="polite"></p>
          <button id="access-button" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="button-label">Access Map</span>
          </button>
        </form>

        <p class="access-note">Authorized patrol access</p>
      </div>
    </section>
  </main>
</body>
</html>
